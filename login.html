<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LifeForce Training</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-page); padding: 1rem; }
        .auth-card { background: var(--bg-card); padding: 3rem; border-radius: 24px; box-shadow: var(--shadow-lg); width: 100%; max-width: 450px; text-align: center; position: relative; }
        .auth-toggles { position: fixed; top: 1.5rem; right: 1.5rem; display: flex; gap: 0.5rem; }
        .auth-form { margin-top: 2.5rem; display: flex; flex-direction: column; gap: 1.25rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.875rem; }
        .input-group { position: relative; }
        .input-group input { width: 100%; padding: 0.875rem 1rem; border-radius: 10px; border: 1.5px solid var(--border-light); font-size: 1rem; transition: border-color 0.2s; background: var(--bg-card); color: var(--text-primary-light); }
        .input-group input:focus { border-color: var(--primary); outline: none; }
        .eye-icon { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-secondary); }
        .social-auth { margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem; }
        body.dark-mode .auth-card { background: var(--card-dark); border: 1px solid var(--border-dark); }
        body.dark-mode .input-group input { background: var(--bg-dark); border-color: var(--border-dark); color: var(--text-primary-dark); }
    </style>
</head>
<body>

    <div class="auth-toggles">
        <button class="icon-btn" id="theme-toggle"><i data-lucide="sun" id="sun-icon"></i><i data-lucide="moon" id="moon-icon" style="display:none;"></i></button>
        <button class="icon-btn" id="rtl-toggle"><i data-lucide="languages"></i></button>
    </div>

    <div class="auth-card fade-in active">
        <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 0.75rem;">
            <i data-lucide="heart-pulse"></i>
            <span>LifeForce</span>
        </a>
        <h2 style="margin-bottom: 0.5rem;">Welcome Back</h2>
        <p style="color: var(--text-secondary); font-size: 0.875rem;">Enter your credentials to access your dashboard.</p>

        <form class="auth-form">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-group">
                    <input type="email" placeholder="name@company.com" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-group">
                    <input type="password" placeholder="••••••••" required id="password-input">
                    <i data-lucide="eye" class="eye-icon" id="toggle-password"></i>
                </div>
            </div>

            <div class="flex justify-between items-center" style="font-size: 0.875rem;">
                <label class="flex items-center gap-2" style="cursor: pointer;">
                    <input type="checkbox" style="accent-color: var(--primary);"> Remember Me
                </label>
                <a href="#" style="color: var(--primary); text-decoration: none; font-weight: 600;">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1rem;">Sign In</button>
        </form>

        <div style="margin: 2rem 0; position: relative;">
            <hr style="border: 0; border-top: 1px solid var(--border-light);">
            <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: inherit; padding: 0 1rem; font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase;">Or continue with</span>
        </div>

        <div class="social-auth" style="display: flex; gap: 1rem; width: 100%; flex-wrap: wrap;">
            <button class="btn btn-secondary" style="flex: 1; min-width: 160px; border-radius: 12px; gap: 0.75rem; white-space: nowrap;"><img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" style="width:18px;"> Google</button>
            <button class="btn btn-secondary" style="flex: 1; min-width: 160px; border-radius: 12px; gap: 0.75rem; white-space: nowrap;"><i data-lucide="apple" size="18"></i> Apple</button>
        </div>

        <p style="margin-top: 2rem; font-size: 0.875rem; color: var(--text-secondary);">
            Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Create Account</a>
        </p>
    </div>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
        const pwm = document.getElementById('toggle-password');
        const pwi = document.getElementById('password-input');
        pwm.addEventListener('click', () => {
            const type = pwi.getAttribute('type') === 'password' ? 'text' : 'password';
            pwi.setAttribute('type', type);
            pwm.innerHTML = type === 'password' ? '<i data-lucide="eye"></i>' : '<i data-lucide="eye-off"></i>';
            lucide.createIcons();
        });
    </script>
</body>
</html>
