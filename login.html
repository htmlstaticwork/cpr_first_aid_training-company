<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LifeForce Training</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start;
            background: var(--bg-page); 
            padding: 1rem var(--container-padding, 1.5rem) 4rem; 
            margin: 0; 
        }
        .auth-controls-wrapper {
            width: 100%;
            max-width: 1280px;
            display: flex;
            justify-content: flex-end;
            position: sticky;
            top: 12px;
            z-index: 1000;
            margin-bottom: 4rem; /* Gap between buttons and card */
            pointer-events: none; /* Let clicks pass through to background if needed, but buttons will have pointer-events auto */
        }
        .auth-toggles { 
            display: flex; 
            gap: 0.75rem; 
            pointer-events: auto;
        }
        .auth-toggles .icon-btn, 
        .auth-toggles .rtl-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            color: var(--text-primary);
            cursor: pointer;
        }
        .auth-card { background: var(--bg-card); padding: 3.5rem 3rem 3rem; border-radius: 24px; box-shadow: var(--shadow-lg); width: 100%; max-width: 450px; text-align: center; position: relative; }

        .auth-form { margin-top: 2.5rem; display: flex; flex-direction: column; gap: 1.25rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.875rem; }
        .input-group { position: relative; }
        .input-group input { width: 100%; padding: 0.875rem 1rem; border-radius: 10px; border: 1.5px solid var(--border); font-size: 1rem; transition: border-color 0.2s; background: var(--bg-card); color: var(--text-primary); }
        .input-group input:focus { border-color: var(--primary); outline: none; }
        .eye-icon { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-secondary); }
        .social-auth { margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem; }
        body.dark-mode .auth-card { background: var(--bg-card); border: 1px solid var(--border); }
        body.dark-mode .input-group input { background: var(--bg-card); border-color: var(--border); color: var(--text-primary); }
        @media (max-width: 480px) {
            .auth-card { padding: 2rem 1.5rem; }
            .auth-form { margin-top: 1.5rem; gap: 1rem; }
            .auth-footer-text { white-space: nowrap; font-size: 0.8125rem !important; }
        }
    </style>
</head>
<body>

    <div class="auth-controls-wrapper">
        <div class="auth-toggles">
            <button class="icon-btn theme-toggle" title="Toggle Theme">
                <i data-lucide="sun" class="sun-icon"></i>
                <i data-lucide="moon" class="moon-icon" style="display:none;"></i>
            </button>
            <button class="rtl-btn rtl-toggle" title="Toggle RTL">
                <span>RTL</span>
            </button>
        </div>
    </div>

    <div class="auth-card fade-in active">
        <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 0.75rem;">
            <i data-lucide="heart-pulse"></i>
            <span>LifeForce</span>
        </a>
        <h2 style="margin-bottom: 0.5rem; font-size: 2.25rem;">Welcome Back</h2>
        <p style="color: var(--text-secondary); font-size: 0.875rem;">Enter your credentials to access your dashboard.</p>

        <form class="auth-form">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-group">
                    <input type="email" placeholder="name@company.com" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-group">
                    <input type="password" placeholder="••••••••" required id="password-input">
                    <i data-lucide="eye" class="eye-icon" id="toggle-password"></i>
                </div>
            </div>

            <div class="flex flex-row justify-between items-center" style="font-size: 0.875rem;">
                <label class="flex flex-row items-center gap-2" style="cursor: pointer;">
                    <input type="checkbox" style="accent-color: var(--primary);"> Remember Me
                </label>
                <a href="#" style="color: var(--primary); text-decoration: none; font-weight: 600;">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1rem;">Sign In</button>
        </form>

        <div style="margin: 2.5rem 0; display: flex; align-items: center; gap: 1rem;">
            <div style="flex: 1; height: 1px; background: var(--border);"></div>
            <span style="font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; white-space: nowrap;">Or continue with</span>
            <div style="flex: 1; height: 1px; background: var(--border);"></div>
        </div>

        <div class="social-auth" style="display: flex; flex-direction: column; gap: 0.75rem; width: 100%;">
            <button class="btn btn-secondary" style="width: 100%; border-radius: 12px; gap: 0.75rem; justify-content: center; padding: 0.75rem;"><img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" style="width:18px;"> Google</button>
            <button class="btn btn-secondary" style="width: 100%; border-radius: 12px; gap: 0.75rem; justify-content: center; padding: 0.75rem;"><i data-lucide="apple" size="18"></i> Apple</button>
        </div>

        <p class="auth-footer-text" style="margin-top: 2rem; font-size: 0.875rem; color: var(--text-secondary);">
            Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Create Account</a>
        </p>
    </div>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
        const pwm = document.getElementById('toggle-password');
        const pwi = document.getElementById('password-input');
        pwm.addEventListener('click', () => {
            const type = pwi.getAttribute('type') === 'password' ? 'text' : 'password';
            pwi.setAttribute('type', type);
            pwm.innerHTML = type === 'password' ? '<i data-lucide="eye"></i>' : '<i data-lucide="eye-off"></i>';
            lucide.createIcons();
        });
    </script>
</body>
</html>
